name: ${LSC_PROJECT_NAME:?}

services:
  fastapi:
    build:
      context: ${LSC_PROJECT_ROOT:?}
      dockerfile: services/docker/images/python/Dockerfile
      target: dev

    restart: unless-stopped

    command: >
      sh -ec "
        python -m alembic -c services/alembic/alembic.ini upgrade head
        fastapi dev --host 0.0.0.0 --port 8000
      "

    env_file: .env

    volumes:
      - ${LSC_PROJECT_ROOT:?}:/code

    labels:
      # Routing
      - traefik.enable=true

      # Network
      - traefik.docker.network=aether-edge

      # Route
      - traefik.http.routers.${LSC_PROJECT_NAME:?}.rule=Host(`${LSC_PROJECT_NAME:?}.localhost`)
      - traefik.http.routers.${LSC_PROJECT_NAME:?}.entrypoints=web
      - traefik.http.services.${LSC_PROJECT_NAME:?}.loadbalancer.server.port=8000

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - edge
      - internal


  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped

    environment:
      - POSTGRES_DB=${LSC_DB_NAME:?}
      - POSTGRES_USER=${LSC_DB_USERNAME:?}
      - POSTGRES_PASSWORD=${LSC_DB_PASSWORD:?}

    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${LSC_DB_USERNAME:?}", "-d", "${LSC_DB_NAME:?}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - internal

networks:
  edge:
    external: true
    name: aether-edge
  internal:

volumes:
  postgres_data:
