[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "landscape"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]==0.162.0",
    "starlette==1.10.0",
    "pydantic==2.14.1",
    "sqlmodel==0.0.48",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pyjwt[crypto]==2.15.1",
    "email-validator==2.3.0",
    "websockets==17.3",
    "aiohttp==3.14.5",
    "anyio==4.15.1",
    "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = [
    "poethepoet==0.48.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.poe.tasks]
install = "uv pip install -e .[dev] --upgrade"
lint = "ruff check ."
coverage = "pytest --cov --cov-branch --cov-report=term-missing:skip-covered"
check = ["lint", "coverage"]

[tool.hatch.build.targets.wheel]
packages = [
    "app",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "COM812",
]
